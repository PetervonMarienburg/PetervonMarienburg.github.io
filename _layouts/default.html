<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
<meta name="description" content="{{ page.description | default: page.abstract | default: site.description | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}"><link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}"></head><body><a class="skip" href="#tresc">Przejdź do treści</a><header class="masthead"><div class="wrap"><a class="brand" href="{{ '/' | relative_url }}"><span class="monogram" aria-hidden="true">P</span>Peter von Marienburg</a><nav class="nav" aria-label="Menu główne"><a href="{{ '/' | relative_url }}">Artykuły</a></nav></div></header><main id="tresc" class="wrap">{{ content }}</main><footer><div class="wrap" style="flex-wrap: wrap;"><span>Peter von Marienburg</span><span>Średniowiecze · rękopisy · rekonstrukcja</span><span id="site-visit-counter" hidden style="white-space: nowrap; font-variant-numeric: tabular-nums;" title="Łącznie dla całej strony od uruchomienia pomiaru. Licznik aktualizuje się z opóźnieniem.">Odwiedziny: <span id="site-visit-total"></span></span></div></footer>
<script data-goatcounter="https://petervonmarienburg.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<script>
(function () {
  var counter = document.getElementById('site-visit-counter');
  var total = document.getElementById('site-visit-total');
  var controller = new AbortController();
  var timeout = setTimeout(function () { controller.abort(); }, 8000);
  fetch('https://petervonmarienburg.goatcounter.com/counter/TOTAL.json', {
    credentials: 'omit',
    signal: controller.signal
  })
    .then(function (response) {
      if (!response.ok) throw new Error('Counter unavailable');
      return response.json();
    })
    .then(function (data) {
      if (typeof data.count !== 'string' && typeof data.count !== 'number') return;
      var count = String(data.count).trim();
      if (!/^[0-9][0-9.,\\s]*$/.test(count)) return;
      total.textContent = count;
      counter.hidden = false;
    })
    .catch(function () { /* Keep the footer clean if statistics are unavailable. */ })
    .finally(function () { clearTimeout(timeout); });
})();
</script>
</body></html>
